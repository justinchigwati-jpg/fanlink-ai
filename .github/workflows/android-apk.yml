name: Build FanLink AI Android Packages

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    name: Build Android Release & Debug Packages
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Node Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Web Application (Vite)
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        run: chmod +x ./android/gradlew

      - name: Generate Release Signing Keystore
        working-directory: ./android/app
        run: |
          keytool -genkeypair -v \
            -keystore release.keystore \
            -alias fanlink \
            -keyalg RSA \
            -keysize 2048 \
            -validity 10000 \
            -storepass fanlinkai2025 \
            -keypass fanlinkai2025 \
            -dname "CN=FanLink AI, OU=Mobile, O=FanLink AI, L=Paris, C=FR"

      - name: Build Debug & Official Release Packages with Gradle
        working-directory: ./android
        run: |
          ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon --stacktrace

      - name: Upload Official Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FanLink-AI-Official-Release-APK
          path: android/app/build/outputs/apk/release/app-release.apk
          retention-days: 30

      - name: Upload Google Play Store AAB Bundle
        uses: actions/upload-artifact@v4
        with:
          name: FanLink-AI-GooglePlay-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
          retention-days: 30
